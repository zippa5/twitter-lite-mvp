<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse · Twitter Lite</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><nav><a class="brand" href="{{ url_for('feed') }}">✦ Pulse</a><div>{% if current_user.is_authenticated %}<span>@{{ current_user.username }}</span><form class="inline" action="{{ url_for('logout') }}" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button>Log out</button></form>{% else %}<a href="{{ url_for('login') }}">Log in</a><a href="{{ url_for('register') }}">Sign up</a>{% endif %}</div></nav></header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
