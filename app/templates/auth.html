{% extends "base.html" %}{% block content %}<section class="card auth"><h1>{{ 'Create account' if mode == 'register' else 'Welcome back' }}</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Username<input name="username" minlength="3" maxlength="30" required autocomplete="username"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"></label><button class="primary">{{ 'Sign up' if mode == 'register' else 'Log in' }}</button></form><p>{% if mode == 'register' %}Already registered? <a href="{{ url_for('login') }}">Log in</a>{% else %}New here? <a href="{{ url_for('register') }}">Create account</a>{% endif %}</p></section>{% endblock %}
